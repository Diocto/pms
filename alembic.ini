[alembic]
script_location = migrations

# 리비전 파일 이름에 순번과 설명이 함께 보이게 한다.
# 예: 001_예약_재고_기본_스키마.py
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url은 여기 적지 않는다. migrations/env.py가 Settings에서 읽는다.
# 접속 정보를 두 곳에 두면 어긋난다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
